# fly.toml app configuration file generated for teamktb on 2026-11-19T21:34:54Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'teamktb'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
